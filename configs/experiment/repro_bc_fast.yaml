# @package _global_

defaults:
  - override /model: smart_mini_3M

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    val_open_loop: true
    val_closed_loop: false
    n_batch_wosac_metric: 0
    n_vis_batch: 0
    token_processor:
      map_token_sampling:
        num_k: 1
        temp: 1.0
      agent_token_sampling:
        num_k: 1
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob
      num_k: -1
      temp: 1.0
    finetune: false

trainer:
  max_epochs: 8
  limit_train_batches: 1.0
  limit_val_batches: 20
  check_val_every_n_epoch: 1
  precision: 16-mixed

data:
  train_batch_size: 1
  val_batch_size: 1
  test_batch_size: 1
  num_workers: 4

action: fit
ckpt_path: null

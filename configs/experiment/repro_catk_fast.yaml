# @package _global_

defaults:
  - override /model: smart_mini_3M

model:
  model_config:
    lr: 5e-5
    lr_min_ratio: 0.05
    val_open_loop: false
    val_closed_loop: false
    n_batch_wosac_metric: 0
    n_vis_batch: 0
    token_processor:
      map_token_sampling:
        num_k: 1
        temp: 1.0
      agent_token_sampling:
        num_k: 1
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob_sampled_with_dist
      num_k: 32
      temp: 1e-5
    training_loss:
      use_gt_raw: true
      gt_thresh_scale_length: -1
      label_smoothing: 0.0
      rollout_as_gt: false
    finetune: true

trainer:
  max_epochs: 4
  limit_train_batches: 1.0
  limit_val_batches: 0
  precision: 16-mixed

data:
  train_batch_size: 1
  val_batch_size: 1
  test_batch_size: 1
  num_workers: 4

action: finetune
ckpt_path: null
